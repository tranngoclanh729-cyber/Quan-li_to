<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản Lý Lớp Học</title>
    <!-- Thư viện React & Tailwind -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- DỮ LIỆU & CẤU HÌNH BAN ĐẦU ---
        const WEEKS_COUNT = 36;
        const DEFAULT_ADMIN_PASS = "12356";

        const DEFAULT_INFRACTIONS_LIST = [
            { id: 'i1', name: 'Đi học muộn', points: 2 },
            { id: 'i2', name: 'Không làm bài tập về nhà', points: 5 },
            { id: 'i3', name: 'Không mặc đồng phục', points: 3 },
            { id: 'i4', name: 'Mất trật tự trong giờ học', points: 2 },
            { id: 'i5', name: 'Sử dụng điện thoại riêng', points: 5 },
            { id: 'i6', name: 'Không trực nhật', points: 5 },
            { id: 'i7', name: 'Nói chuyện riêng / Ăn vặt', points: 2 }
        ];

        const INITIAL_STUDENTS = [
            // Tổ 1
            { id: 's101', name: 'Nguyễn Văn An', teamId: 1, phone: '0912345671' },
            { id: 's102', name: 'Trần Thị Bình', teamId: 1, phone: '0912345672' },
            { id: 's103', name: 'Lê Hoàng Cường', teamId: 1, phone: '0912345673' },
            { id: 's104', name: 'Phạm Minh Đức', teamId: 1, phone: '0912345674' },
            // Tổ 2
            { id: 's201', name: 'Hoàng Thảo Giang', teamId: 2, phone: '0912345675' },
            { id: 's202', name: 'Vũ Quốc Hải', teamId: 2, phone: '0912345676' },
            { id: 's203', name: 'Đặng Mai Huế', teamId: 2, phone: '0912345677' },
            { id: 's204', name: 'Bùi Tuấn Kiệt', teamId: 2, phone: '0912345678' },
            // Tổ 3
            { id: 's301', name: 'Đỗ Thúy Linh', teamId: 3, phone: '0912345679' },
            { id: 's302', name: 'Ngô Quang Nam', teamId: 3, phone: '0912345680' },
            { id: 's303', name: 'Dương Yến Nhi', teamId: 3, phone: '0912345681' },
            { id: 's304', name: 'Lý Phúc Phong', teamId: 3, phone: '0912345682' },
            // Tổ 4
            { id: 's401', name: 'Phan Thanh Sơn', teamId: 4, phone: '0912345683' },
            { id: 's402', name: 'Trịnh Ngọc Trinh', teamId: 4, phone: '0912345684' },
            { id: 's403', name: 'Cao Quốc Uy', teamId: 4, phone: '0912345685' },
            { id: 's404', name: 'Hồ Tường Vy', teamId: 4, phone: '0912345686' }
        ];

        const INITIAL_RECORDS = {
            speechSample: [
                { id: 'r1', studentId: 's101', teamId: 1, week: 1, type: 'speech', count: 2, timestamp: '07:10 12/10' },
                { id: 'r2', studentId: 's202', teamId: 2, week: 1, type: 'speech', count: 1, timestamp: '07:15 13/10' }
            ],
            infractionsSample: [
                { id: 'r6', studentId: 's103', teamId: 1, week: 1, type: 'infraction', title: 'Đi học muộn', points: 2, timestamp: '09:10 12/10' },
                { id: 'r7', studentId: 's202', teamId: 2, week: 1, type: 'infraction', title: 'Không làm bài tập về nhà', points: 5, timestamp: '07:15 13/10' }
            ]
        };

        function App() {
            const [currentWeek, setCurrentWeek] = useState(1);
            const [selectedWeekTab, setSelectedWeekTab] = useState('overview');
            const [activeTab, setActiveTab] = useState('overview');
            const [role, setRole] = useState('guest'); // guest, verifier, admin

            const [showLoginModal, setShowLoginModal] = useState(false);
            const [loginRoleTarget, setLoginRoleTarget] = useState('admin');
            const [inputPassword, setInputPassword] = useState('');
            const [showPassword, setShowPassword] = useState(false);
            const [authError, setAuthError] = useState('');

            // Local Storage data
            const [students, setStudents] = useState(() => {
                const saved = localStorage.getItem('class_students');
                return saved ? JSON.parse(saved) : INITIAL_STUDENTS;
            });

            const [records, setRecords] = useState(() => {
                const saved = localStorage.getItem('class_records');
                return saved ? JSON.parse(saved) : INITIAL_RECORDS;
            });

            const [infractionsList, setInfractionsList] = useState(() => {
                const saved = localStorage.getItem('class_infractions_catalog');
                return saved ? JSON.parse(saved) : DEFAULT_INFRACTIONS_LIST;
            });

            const [notification, setNotification] = useState(null);

            const showNotification = (msg, type = 'success') => {
                setNotification({ msg, type });
                setTimeout(() => setNotification(null), 3000);
            };

            const handleLogin = (e) => {
                e.preventDefault();
                if (loginRoleTarget === 'admin') {
                    if (inputPassword === DEFAULT_ADMIN_PASS) {
                        setRole('admin');
                        setShowLoginModal(false);
                        setInputPassword('');
                        showNotification('Đã đăng nhập quyền Quản trị viên!');
                    } else {
                        setAuthError('Mật khẩu quản trị không đúng.');
                    }
                } else if (loginRoleTarget === 'verifier') {
                    setRole('verifier');
                    setShowLoginModal(false);
                    setInputPassword('');
                    showNotification('Đã chuyển sang phân quyền Người Duyệt.');
                }
            };

            const handleLogout = () => {
                setRole('guest');
                showNotification('Đã quay về giao diện Khách');
            };

            return (
                <div className="min-h-screen bg-slate-50 text-slate-800 pb-16">
                    {/* Notification Toast */}
                    {notification && (
                        <div className={`fixed top-4 right-4 z-50 px-4 py-2 rounded-lg shadow-lg text-white ${notification.type === 'error' ? 'bg-red-500' : 'bg-emerald-500'}`}>
                            {notification.msg}
                        </div>
                    )}

                    {/* Header */}
                    <header className="bg-indigo-900 text-white shadow-md sticky top-0 z-40">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                            <div className="flex items-center space-x-3">
                                <h1 className="text-xl font-bold">Quản Lý Lớp Học</h1>
                                <span className="text-xs bg-indigo-700 px-2.5 py-1 rounded-full">Tuần {currentWeek}</span>
                            </div>
                            <div className="flex items-center space-x-2">
                                {role === 'guest' ? (
                                    <button onClick={() => { setLoginRoleTarget('admin'); setShowLoginModal(true); setAuthError(''); }} className="bg-indigo-700 hover:bg-indigo-600 px-3 py-1.5 rounded-lg text-xs font-semibold">
                                        Đăng Nhập
                                    </button>
                                ) : (
                                    <div className="flex items-center space-x-2">
                                        <span className="text-xs bg-emerald-600 px-2 py-1 rounded">Quyền: {role.toUpperCase()}</span>
                                        <button onClick={handleLogout} className="bg-red-600 hover:bg-red-500 px-3 py-1.5 rounded-lg text-xs font-semibold">
                                            Đăng Xuất
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="max-w-7xl mx-auto px-4 py-6">
                        <div className="bg-white rounded-2xl shadow-sm p-6 text-center">
                            <h2 className="text-2xl font-bold text-indigo-900 mb-2">Chào mừng đến với Hệ thống Quản Lý Lớp Học</h2>
                            <p className="text-slate-600 mb-6">Ứng dụng đã hoạt động thành công trên GitHub Pages!</p>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-left">
                                <div className="p-4 bg-indigo-50 rounded-xl">
                                    <h3 className="font-semibold text-indigo-900 mb-1">📊 Tổng số học sinh</h3>
                                    <p className="text-2xl font-bold text-indigo-600">{students.length} em</p>
                                </div>
                                <div className="p-4 bg-emerald-50 rounded-xl">
                                    <h3 className="font-semibold text-emerald-900 mb-1">⭐ Tổng số tổ</h3>
                                    <p className="text-2xl font-bold text-emerald-600">4 Tổ</p>
                                </div>
                                <div className="p-4 bg-amber-50 rounded-xl">
                                    <h3 className="font-semibold text-amber-900 mb-1">⚠️ Trạng thái</h3>
                                    <p className="text-2xl font-bold text-amber-600">Hoạt động tốt</p>
                                </div>
                            </div>
                        </div>
                    </main>

                    {/* Login Modal */}
                    {showLoginModal && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl">
                                <h3 className="text-lg font-bold text-slate-800 mb-4">Đăng Nhập Quản Trị</h3>
                                <form onSubmit={handleLogin}>
                                    <div className="mb-4">
                                        <label className="block text-sm font-medium text-slate-700 mb-1">Mật khẩu Admin (Mặc định: 12356)</label>
                                        <input 
                                            type="password" 
                                            value={inputPassword} 
                                            onChange={(e) => setInputPassword(e.target.value)}
                                            className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
                                            placeholder="Nhập mật khẩu..."
                                            required
                                        />
                                    </div>
                                    {authError && <p className="text-red-500 text-sm mb-4">{authError}</p>}
                                    <div className="flex justify-end space-x-3">
                                        <button type="button" onClick={() => setShowLoginModal(false)} className="px-4 py-2 border rounded-lg text-slate-600 hover:bg-slate-50">Hủy</button>
                                        <button type="submit" className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-semibold">Đăng Nhập</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
