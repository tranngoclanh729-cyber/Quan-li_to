<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản Lý Lớp Học Theo 4 Tổ</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

<body class="bg-slate-50 text-slate-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const IconBase = ({ children, className = "w-4 h-4" }) => (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">{children}</svg>
        );
        const Users = (p) => <IconBase {...p}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></IconBase>;
        const AlertTriangle = (p) => <IconBase {...p}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></IconBase>;
        const Calendar = (p) => <IconBase {...p}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></IconBase>;
        const Lock = (p) => <IconBase {...p}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></IconBase>;
        const Trash2 = (p) => <IconBase {...p}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></IconBase>;
        const Edit3 = (p) => <IconBase {...p}><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></IconBase>;
        const UserCheck = (p) => <IconBase {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><polyline points="17 11 19 13 23 9"></polyline></IconBase>;
        const Settings = (p) => <IconBase {...p}><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></IconBase>;
        const LogOut = (p) => <IconBase {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></IconBase>;
        const Trophy = (p) => <IconBase {...p}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17"></path><path d="M14 14.66V17"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"></path></IconBase>;

        const WEEKS_COUNT = 36;
        const DEFAULT_ADMIN_PASS = "12356";

        const DEFAULT_INFRACTIONS_LIST = [
          { id: 'i1', name: 'Đi học muộn', points: 2 },
          { id: 'i2', name: 'Không làm bài tập về nhà', points: 5 },
          { id: 'i3', name: 'Không mặc đồng phục', points: 3 },
          { id: 'i4', name: 'Mất trật tự trong giờ học', points: 2 },
          { id: 'i5', name: 'Sử dụng điện thoại riêng', points: 5 },
          { id: 'i6', name: 'Không trực nhật', points: 5 },
          { id: 'i7', name: 'Nói chuyện riêng / Ăn vặt', points: 2 }
        ];

        const INITIAL_STUDENTS = [
          { id: 's101', name: 'Nguyễn Văn An', teamId: 1, phone: '0912345671' },
          { id: 's102', name: 'Trần Thị Bình', teamId: 1, phone: '0912345672' },
          { id: 's103', name: 'Lê Hoàng Cường', teamId: 1, phone: '0912345673' },
          { id: 's104', name: 'Phạm Minh Đức', teamId: 1, phone: '0912345674' },
          { id: 's201', name: 'Hoàng Thảo Giang', teamId: 2, phone: '0912345675' },
          { id: 's202', name: 'Vũ Quốc Hải', teamId: 2, phone: '0912345676' },
          { id: 's203', name: 'Đặng Mai Huệ', teamId: 2, phone: '0912345677' },
          { id: 's204', name: 'Bùi Tuấn Kiệt', teamId: 2, phone: '0912345678' },
          { id: 's301', name: 'Đỗ Thúy Linh', teamId: 3, phone: '0912345679' },
          { id: 's302', name: 'Ngô Quang Nam', teamId: 3, phone: '0912345680' },
          { id: 's303', name: 'Dương Yến Nhi', teamId: 3, phone: '0912345681' },
          { id: 's304', name: 'Lý Phúc Phong', teamId: 3, phone: '0912345682' },
          { id: 's401', name: 'Phan Thanh Sơn', teamId: 4, phone: '0912345683' },
          { id: 's402', name: 'Trịnh Ngọc Trinh', teamId: 4, phone: '0912345684' },
          { id: 's403', name: 'Cao Quốc Uy', teamId: 4, phone: '0912345685' },
          { id: 's404', name: 'Hồ Tường Vy', teamId: 4, phone: '0912345686' }
        ];

        const INITIAL_RECORDS = [
          { id: 'r1', studentId: 's101', teamId: 1, week: 1, type: 'speech', count: 3, timestamp: '10:15 12/10' },
          { id: 'r2', studentId: 's102', teamId: 1, week: 1, type: 'speech', count: 2, timestamp: '11:00 12/10' },
          { id: 'r3', studentId: 's201', teamId: 2, week: 1, type: 'speech', count: 4, timestamp: '08:30 13/10' },
          { id: 'r4', studentId: 's301', teamId: 3, week: 1, type: 'speech', count: 5, timestamp: '14:20 13/10' },
          { id: 'r5', studentId: 's103', teamId: 1, week: 1, type: 'infraction', title: 'Mất trật tự trong giờ học', points: 2, timestamp: '09:10 12/10' },
          { id: 'r6', studentId: 's202', teamId: 2, week: 1, type: 'infraction', title: 'Đi học muộn', points: 2, timestamp: '07:15 13/10' },
          { id: 'r7', studentId: 's202', teamId: 2, week: 1, type: 'infraction', title: 'Không làm bài tập về nhà', points: 5, timestamp: '08:00 14/10' },
          { id: 'r8', studentId: 's402', teamId: 4, week: 1, type: 'infraction', title: 'Không mặc đồng phục', points: 3, timestamp: '07:20 12/10' }
        ];

        function App() {
          const [currentWeek, setCurrentWeek] = useState(1);
          const [selectedWeekTab, setSelectedWeekTab] = useState(1);
          const [activeTab, setActiveTab] = useState('overview'); 
          const [role, setRole] = useState('guest'); 
          
          const [showLoginModal, setShowLoginModal] = useState(false);
          const [loginRoleTarget, setLoginRoleTarget] = useState('admin');
          const [inputPassword, setInputPassword] = useState('');
          const [showPassword, setShowPassword] = useState(false);
          const [authError, setAuthError] = useState('');

          const [students, setStudents] = useState(() => {
            const saved = localStorage.getItem('class_students');
            return saved ? JSON.parse(saved) : INITIAL_STUDENTS;
          });

          const [records, setRecords] = useState(() => {
            const saved = localStorage.getItem('class_records');
            return saved ? JSON.parse(saved) : INITIAL_RECORDS;
          });

          const [infractionsList, setInfractionsList] = useState(() => {
            const saved = localStorage.getItem('class_infractions_catalog');
            return saved ? JSON.parse(saved) : DEFAULT_INFRACTIONS_LIST;
          });

          const [pendingWeek, setPendingWeek] = useState(1);
          const [showWeekModal, setShowWeekModal] = useState(false);
          const [showAddStudentModal, setShowAddStudentModal] = useState(false);
          const [newStudent, setNewStudent] = useState({ name: '', teamId: 1, phone: '' });
          const [editingStudent, setEditingStudent] = useState(null);
          const [showTransferModal, setShowTransferModal] = useState(false);
          const [transferTarget, setTransferTarget] = useState({ studentId: '', toTeamId: 1 });
          const [showInfractionModal, setShowInfractionModal] = useState(false);
          const [newInfractionItem, setNewInfractionItem] = useState({ name: '', points: 2 });

          const [gradingTeam, setGradingTeam] = useState(1);
          const [selectedStudentForGrading, setSelectedStudentForGrading] = useState('');
          const [speechIncrement, setSpeechIncrement] = useState(1);
          const [selectedInfractionId, setSelectedInfractionId] = useState('');
          const [customInfractionDesc, setCustomInfractionDesc] = useState('');

          const [toast, setToast] = useState(null);

          useEffect(() => {
            localStorage.setItem('class_students', JSON.stringify(students));
          }, [students]);

          useEffect(() => {
            localStorage.setItem('class_records', JSON.stringify(records));
          }, [records]);

          useEffect(() => {
            localStorage.setItem('class_infractions_catalog', JSON.stringify(infractionsList));
          }, [infractionsList]);

          const showNotification = (msg, type = 'success') => {
            setToast({ msg, type });
            setTimeout(() => setToast(null), 3000);
          };

          // --- TÍNH NĂNG XUẤT & NHẬP DỮ LIỆU ĐỂ CHIA SẺ ---
          const handleExportData = () => {
            const dataToExport = { students, records, infractionsList, currentWeek };
            const blob = new Blob([JSON.stringify(dataToExport, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `du-lieu-quan-li-lop-tuan-${currentWeek}.json`;
            a.click();
            showNotification('Đã xuất file dữ liệu thành công!');
          };

          const handleImportData = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
              try {
                const parsed = JSON.parse(event.target.result);
                if (parsed.students) setStudents(parsed.students);
                if (parsed.records) setRecords(parsed.records);
                if (parsed.infractionsList) setInfractionsList(parsed.infractionsList);
                if (parsed.currentWeek) {
                  setCurrentWeek(parsed.currentWeek);
                  setSelectedWeekTab(parsed.currentWeek);
                }
                showNotification('Khôi phục dữ liệu thành công!');
              } catch (err) {
                showNotification('File dữ liệu không hợp lệ!', 'error');
              }
            };
            reader.readAsText(file);
          };

          const handleLogin = (e) => {
            e.preventDefault();
            setAuthError('');
            if (loginRoleTarget === 'admin') {
              if (inputPassword === DEFAULT_ADMIN_PASS) {
                setRole('admin');
                setShowLoginModal(false);
                setInputPassword('');
                showNotification('Đã đăng nhập quyền Quản trị viên (Admin)!');
              } else {
                setAuthError('Mật khẩu Admin không đúng!');
              }
            } else if (loginRoleTarget === 'verifier') {
              if (inputPassword === '123') {
                setRole('verifier');
                setShowLoginModal(false);
                setInputPassword('');
                showNotification('Đã đăng nhập quyền Người duyệt!');
              } else {
                setAuthError('Mật khẩu không đúng! (Gợi ý: 123)');
              }
            }
          };

          const handleLogout = () => {
            setRole('guest');
            showNotification('Đã quay về quyền Khách');
          };

          const confirmWeekChange = () => {
            setCurrentWeek(pendingWeek);
            setSelectedWeekTab(pendingWeek);
            setShowWeekModal(false);
            showNotification(`Đã chuyển sang Tuần học ${pendingWeek}!`);
          };

          const handleAddStudent = (e) => {
            e.preventDefault();
            if (!newStudent.name.trim()) return;
            const created = {
              id: 's_' + Date.now(),
              name: newStudent.name.trim(),
              teamId: Number(newStudent.teamId),
              phone: newStudent.phone.trim() || 'Chưa cập nhật'
            };
            setStudents([...students, created]);
            setNewStudent({ name: '', teamId: 1, phone: '' });
            setShowAddStudentModal(false);
            showNotification(`Đã thêm học sinh ${created.name}`);
          };

          const handleUpdateStudent = (e) => {
            e.preventDefault();
            if (!editingStudent) return;
            setStudents(students.map(s => s.id === editingStudent.id ? editingStudent : s));
            setEditingStudent(null);
            showNotification('Cập nhật thông tin thành công');
          };

          const handleDeleteStudent = (id, name) => {
            if (window.confirm(`Bạn có chắc muốn xóa học sinh "${name}"?`)) {
              setStudents(students.filter(s => s.id !== id));
              showNotification(`Đã xóa học sinh ${name}`);
            }
          };

          const handleTransferTeam = (e) => {
            e.preventDefault();
            const { studentId, toTeamId } = transferTarget;
            if (!studentId) return;
            setStudents(students.map(s => s.id === studentId ? { ...s, teamId: Number(toTeamId) } : s));
            setShowTransferModal(false);
            showNotification('Chuyển tổ thành công!');
          };

          const handleAddSpeech = () => {
            if (!selectedStudentForGrading) {
              showNotification('Vui lòng chọn học sinh!', 'error');
              return;
            }
            const student = students.find(s => s.id === selectedStudentForGrading);
            if (!student) return;

            const newRecord = {
              id: 'r_' + Date.now(),
              studentId: student.id,
              teamId: student.teamId,
              week: selectedWeekTab,
              type: 'speech',
              count: Number(speechIncrement),
              timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ' ' + new Date().toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit' })
            };

            setRecords([newRecord, ...records]);
            showNotification(`Đã cộng ${speechIncrement} lượt phát biểu cho ${student.name}`);
          };

          const handleAddInfractionRecord = () => {
            if (!selectedStudentForGrading) {
              showNotification('Vui lòng chọn học sinh!', 'error');
              return;
            }
            const student = students.find(s => s.id === selectedStudentForGrading);
            if (!student) return;

            let title = '';
            let points = 2;

            if (selectedInfractionId === 'custom') {
              if (!customInfractionDesc.trim()) {
                showNotification('Vui lòng nhập mô tả lỗi!', 'error');
                return;
              }
              title = customInfractionDesc.trim();
              points = 2;
            } else {
              const found = infractionsList.find(i => i.id === selectedInfractionId);
              if (!found) {
                showNotification('Vui lòng chọn lỗi vi phạm!', 'error');
                return;
              }
              title = found.name;
              points = found.points;
            }

            const newRecord = {
              id: 'r_' + Date.now(),
              studentId: student.id,
              teamId: student.teamId,
              week: selectedWeekTab,
              type: 'infraction',
              title,
              points: Number(points),
              timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ' ' + new Date().toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit' })
            };

            setRecords([newRecord, ...records]);
            setCustomInfractionDesc('');
            showNotification(`Đã ghi nhận vi phạm cho ${student.name}`);
          };

          const handleDeleteRecord = (recordId) => {
            if (role === 'guest') {
              showNotification('Khách không có quyền xóa bản ghi này', 'error');
              return;
            }
            setRecords(records.filter(r => r.id !== recordId));
            showNotification('Đã xóa bản ghi');
          };

          const handleAddInfractionCatalog = (e) => {
            e.preventDefault();
            if (!newInfractionItem.name.trim()) return;
            const newItem = {
              id: 'i_' + Date.now(),
              name: newInfractionItem.name.trim(),
              points: Number(newInfractionItem.points) || 1
            };
            setInfractionsList([...infractionsList, newItem]);
            setNewInfractionItem({ name: '', points: 2 });
            setShowInfractionModal(false);
            showNotification('Thêm vi phạm mẫu thành công');
          };

          const handleDeleteInfractionCatalog = (id) => {
            setInfractionsList(infractionsList.filter(i => i.id !== id));
            showNotification('Đã xóa danh mục lỗi');
          };

          const maskPhone = (phone) => {
            if (!phone) return 'Chưa cập nhật';
            if (role === 'admin' || role === 'verifier') return phone;
            return phone.substring(0, 3) + '****' + phone.slice(-3);
          };

          const teamStats = useMemo(() => {
            const teams = [1, 2, 3, 4];
            return teams.map(teamId => {
              const members = students.filter(s => s.teamId === teamId);
              const speechesWeek = records.filter(r => r.teamId === teamId && r.week === selectedWeekTab && r.type === 'speech').reduce((acc, curr) => acc + (curr.count || 0), 0);
              const speechesYear = records.filter(r => r.teamId === teamId && r.type === 'speech').reduce((acc, curr) => acc + (curr.count || 0), 0);
              const infractionsWeek = records.filter(r => r.teamId === teamId && r.week === selectedWeekTab && r.type === 'infraction');
              const penaltyPointsWeek = infractionsWeek.reduce((acc, curr) => acc + (curr.points || 0), 0);
              const weeklyScore = 100 + (speechesWeek * 2) - penaltyPointsWeek;
              return { teamId, memberCount: members.length, speechesWeek, speechesYear, infractionsWeek, penaltyPointsWeek, weeklyScore };
            });
          }, [students, records, selectedWeekTab]);

          const studentRankings = useMemo(() => {
            return students.map(st => {
              const speechesWeek = records.filter(r => r.studentId === st.id && r.week === selectedWeekTab && r.type === 'speech').reduce((acc, curr) => acc + curr.count, 0);
              const infractionsWeek = records.filter(r => r.studentId === st.id && r.week === selectedWeekTab && r.type === 'infraction');
              const penaltyWeek = infractionsWeek.reduce((acc, curr) => acc + curr.points, 0);
              return { ...st, speechesWeek, penaltyWeek, scoreWeek: (speechesWeek * 2) - penaltyWeek };
            }).sort((a, b) => b.scoreWeek - a.scoreWeek);
          }, [students, records, selectedWeekTab]);

          return (
            <div className="min-h-screen bg-slate-50 text-slate-800 font-sans flex flex-col">
              {toast && (
                <div className={`fixed top-4 right-4 z-50 px-4 py-3 rounded-lg shadow-lg text-white font-medium text-sm flex items-center space-x-2 ${toast.type === 'error' ? 'bg-red-600' : 'bg-emerald-600'}`}>
                  <span>{toast.msg}</span>
                </div>
              )}

              <header className="bg-indigo-900 text-white shadow-md sticky top-0 z-30">
                <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
                  <div className="flex items-center space-x-3">
                    <div className="p-2 bg-indigo-700 rounded-lg">
                      <Users className="w-6 h-6 text-indigo-200" />
                    </div>
                    <div>
                      <h1 className="text-xl font-bold tracking-tight">QUẢN LÝ LỚP HỌC THEO 4 TỔ</h1>
                      <p className="text-xs text-indigo-200">Hệ thống Thi đua & Kỷ luật</p>
                    </div>
                  </div>

                  <div className="flex items-center space-x-3">
                    {/* KHU VỰC XUẤT/NHẬP DỮ LIỆU ĐỂ CHIA SẺ CHO NGƯỜI KHÁC */}
                    <div className="flex items-center space-x-1 bg-indigo-800 px-3 py-1.5 rounded-lg border border-indigo-700">
                      <button onClick={handleExportData} className="text-xs text-amber-300 hover:text-amber-200 font-semibold px-1" title="Tải file dữ liệu để gửi cho người khác">
                        📤 Sao Lưu
                      </button>
                      <span className="text-indigo-500">|</span>
                      <label className="text-xs text-emerald-300 hover:text-emerald-200 font-semibold px-1 cursor-pointer" title="Tải file dữ liệu lên để đồng bộ">
                        📥 Phục Hồi
                        <input type="file" accept=".json" onChange={handleImportData} className="hidden" />
                      </label>
                    </div>

                    <div className="bg-indigo-800/80 border border-indigo-700 px-3 py-1.5 rounded-lg flex items-center space-x-2 text-sm">
                      <Calendar className="w-4 h-4 text-indigo-300" />
                      <span>Tuần: <strong className="text-amber-300">{currentWeek}</strong></span>
                      {role === 'admin' && (
                        <button onClick={() => { setPendingWeek(currentWeek); setShowWeekModal(true); }} className="ml-2 text-xs bg-amber-500 hover:bg-amber-600 text-slate-900 px-2 py-0.5 rounded font-semibold">
                          Đổi
                        </button>
                      )}
                    </div>

                    {role === 'guest' ? (
                      <button onClick={() => { setShowLoginModal(true); setLoginRoleTarget('admin'); }} className="flex items-center space-x-1 bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-2 rounded-lg font-medium">
                        <Lock className="w-3.5 h-3.5" />
                        <span>Đăng nhập</span>
                      </button>
                    ) : (
                      <div className="flex items-center space-x-2">
                        <span className={`text-xs px-2.5 py-1 rounded-full font-semibold border ${role === 'admin' ? 'bg-rose-500/20 text-rose-200 border-rose-400' : 'bg-emerald-500/20 text-emerald-200 border-emerald-400'}`}>
                          {role === 'admin' ? 'Admin' : 'Người duyệt'}
                        </span>

                    <h3 className="font-bold mb-4">Sửa Học Sinh</h3>
                    <form onSubmit={handleUpdateStudent} className="space-y-4">
                      <input type="text" required value={editingStudent.name} onChange={(e) => setEditingStudent({ ...editingStudent, name: e.target.value })} className="w-full border rounded-lg p-2 text-sm" />
                      <input type="text" value={editingStudent.phone} onChange={(e) => setEditingStudent({ ...editingStudent, phone: e.target.value })} className="w-full border rounded-lg p-2 text-sm" />
                      <button type="submit" className="w-full bg-indigo-600 text-white font-bold py-2 rounded-lg text-xs">Cập Nhật</button>
                    </form>
                  </div>
                </div>
              )}
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
